name: Build Backline

on:
  push:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'Mac de GitHub : macos-15 (Apple Silicon) ou macos-15-intel'
        default: 'macos-15'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "build/PluginManager_artefacts/Release/Backline.exe" -DestinationPath Backline-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Backline-Windows
          path: Backline-Windows.zip
          if-no-files-found: error

  macos:
    permissions:
      contents: write
    runs-on: ${{ inputs.mac_runner || 'macos-15' }}   # Mac Apple Silicon par defaut (binaire universel) ; mac-retry.yml relance sur macos-15-intel si aucune machine n'est prise
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Signature locale (ad hoc) et archive
        run: |
          cd "build/PluginManager_artefacts/Release"
          xattr -cr "Backline.app"
          codesign --force --deep --sign - "Backline.app"
          codesign --verify --deep --strict "Backline.app"
          ditto -c -k --sequesterRsrc --keepParent "Backline.app" "$GITHUB_WORKSPACE/Backline-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Backline-macOS
          path: Backline-macOS.zip
          if-no-files-found: error
      - name: Ajout a la version publiee
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/^project([A-Za-z0-9_]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          for i in $(seq 1 40); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 30; done     # la version Windows est publiee d'abord
          cp Backline-macOS.zip Plugin-Manager-macOS.zip   # pour la mise a jour automatique des versions 1.1.x (ancien nom)
          gh release upload "$TAG" Backline-macOS.zip Plugin-Manager-macOS.zip --clobber

  # Publie la version (tag v<VERSION de CMakeLists>) ; fichiers a nom fixe pour les liens .../releases/latest/download/...
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project([A-Za-z0-9_]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Backline-Windows
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          cp Backline-Windows.zip Plugin-Manager-Windows.zip   # pour la mise a jour automatique des versions 1.1.x (ancien nom)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Backline-Windows.zip Plugin-Manager-Windows.zip --clobber
          else
            gh release create "$TAG" Backline-Windows.zip Plugin-Manager-Windows.zip --target "$GITHUB_SHA" --latest \
              --title "Backline $TAG" \
              --notes "Windows : dezipper et lancer Backline.exe. macOS : dezipper, puis clic droit > Ouvrir sur Backline.app la premiere fois."
          fi
